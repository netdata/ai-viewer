# ai-viewer CI workflow.
#
# Role
#   This workflow is the substrate for every automated quality gate
#   enumerated in .agents/sow/specs/quality-gates.md. Each gate in that
#   spec maps to a step inside one of the four jobs below. The workflow
#   itself does not invent gates; it executes the commands defined by
#   the project skills and aggregate scripts (scripts/lint.sh,
#   scripts/test.sh, scripts/gates.sh) once they exist.
#
# Conditional-skip pattern
#   The repository is bootstrapped spec-first. On any given commit a job
#   may have no source code to act on (no go.mod, no frontend, no
#   gates.sh). Each job opens with a presence check; if the relevant
#   tree is absent, the job emits a no-op marker and exits green. As
#   each future SOW lands the relevant tree, the job's body runs end to
#   end without any workflow edit. This keeps the contract stable while
#   the project grows.
#
# Job-name contract
#   The job IDs below (lint, test, frontend, embed-smoke, gates) are the
#   contract for branch-protection required status checks. SOW-0013
#   will register these exact names via the GitHub branch-protection
#   API. Renaming a job is a breaking change to that contract and
#   requires a SOW. `embed-smoke` (SOW-0001 Chunk 17) is the new
#   top-level concern that proves the single binary serves the built UI;
#   SOW-0013 registers it alongside the original four.
#
# Extending
#   Future quality SOWs (SOW-0009 onwards) extend this workflow by
#   adding steps to the relevant existing job. A new job is added only
#   when a new top-level concern emerges (e.g. a release job, a
#   benchmarks-only nightly schedule). New job names follow the same
#   contract rule: register them in branch protection in the same SOW
#   that introduces them.
#
# Deferred to subsequent SOWs
#   Gate landing status (.agents/sow/specs/quality-gates.md):
#     - SOW-0009 (LANDED) — strict .golangci.yml + standalone pinned gosec +
#                  pinned tool versions; nightly govulncheck.
#     - SOW-0010 (LANDED) — scripts/{test,check-coverage}.sh: statement
#                  coverage gate (internal/* >= 80%, /cmd/ excluded) enforced
#                  in the test job; nightly race stress (race-stress-nightly.yml).
#                  Branch coverage, new-code-in-PR diff (SOW-0036), and a
#                  per-push -count=3 / coverage PR comment were re-scoped/deferred.
#     - SOW-0011 (pending) — fuzz targets + property tests + benchstat baseline
#                  enforcement (replaces benchtime=1x smoke run below)
#     - SOW-0012 — scripts/check-bundle-size.js + axe a11y threshold
#                  enforcement (replaces bundle-size report below)
#     - SOW-0013 — scripts/{gates,spec-drift}.sh + CodeQL workflow +
#                  Dependabot config
#   The secrets + operator-PII scanner (scripts/scan-secrets.sh) and its
#   negative self-test (scripts/test/scan-secrets-test.sh) are already
#   implemented and run as REQUIRED, fail-closed steps in the gates job
#   below; they are not deferred.
#   Each of those SOWs adds steps to existing jobs OR adds new jobs.
#   They do not require renaming the four current jobs.
#
# Out of scope here
#   Dependabot config, CodeQL workflow, deployment and release
#   pipelines, and nightly schedules all land in their own SOWs and
#   their own workflow files. This file covers push and pull-request
#   CI only.

name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# Cancel superseded PR runs to save CI minutes. Master runs are never
# cancelled so the audit trail of every merged commit is preserved.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect Go module
        id: detect
        shell: bash
        run: |
          if [[ -f go.mod ]]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi
          if [[ -f .golangci.yml || -f .golangci.yaml ]]; then
            echo "golangci=true" >> "$GITHUB_OUTPUT"
          else
            echo "golangci=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip notice (no Go module yet)
        if: steps.detect.outputs.go != 'true'
        run: echo "No go.mod present; lint job is a no-op on this commit."

      - name: Set up Go
        if: steps.detect.outputs.go == 'true'
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Verify go.mod and go.sum
        if: steps.detect.outputs.go == 'true'
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: gofmt
        if: steps.detect.outputs.go == 'true'
        run: |
          diff=$(gofmt -l .)
          if [[ -n "$diff" ]]; then
            echo "gofmt diff in:"
            echo "$diff"
            exit 1
          fi

      - name: goimports
        if: steps.detect.outputs.go == 'true'
        run: |
          go install golang.org/x/tools/cmd/goimports@latest
          diff=$(goimports -l .)
          if [[ -n "$diff" ]]; then
            echo "goimports diff in:"
            echo "$diff"
            exit 1
          fi

      - name: go vet
        if: steps.detect.outputs.go == 'true'
        run: go vet ./...

      - name: Read pinned golangci-lint version
        id: golangci_version
        if: steps.detect.outputs.go == 'true' && steps.detect.outputs.golangci == 'true'
        shell: bash
        run: echo "version=$(tr -d '[:space:]' < .golangci-lint-version)" >> "$GITHUB_OUTPUT"

      - name: golangci-lint
        if: steps.detect.outputs.go == 'true' && steps.detect.outputs.golangci == 'true'
        uses: golangci/golangci-lint-action@v9
        with:
          # Single source of truth: .golangci-lint-version (SOW-0009). A version
          # bump is an intentional, reviewable one-line diff. The action also
          # caches golangci's analysis cache, keeping the warm CI run fast.
          version: ${{ steps.golangci_version.outputs.version }}
          args: --timeout=5m

      - name: govulncheck
        if: steps.detect.outputs.go == 'true'
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: gosec
        if: steps.detect.outputs.go == 'true'
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.26.1
          gosec -severity medium -confidence medium ./...

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect Go module
        id: detect
        shell: bash
        run: |
          if [[ -f go.mod ]]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip notice (no Go module yet)
        if: steps.detect.outputs.go != 'true'
        run: echo "No go.mod present; test job is a no-op on this commit."

      - name: Set up Go
        if: steps.detect.outputs.go == 'true'
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Build
        if: steps.detect.outputs.go == 'true'
        run: go build ./...

      - name: Test with race detector and coverage
        if: steps.detect.outputs.go == 'true'
        run: |
          go test -race -count=1 \
            -coverprofile=coverage.out \
            -covermode=atomic \
            ./...

      - name: Coverage summary
        if: steps.detect.outputs.go == 'true'
        run: go tool cover -func=coverage.out | tail -1

      - name: Upload coverage artifact
        if: steps.detect.outputs.go == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: go-coverage-${{ github.run_id }}
          path: coverage.out
          if-no-files-found: error
          retention-days: 14

      # Self-test the coverage gate script itself (synthetic profiles) so a
      # regression in scripts/check-coverage.sh is caught in CI, not just locally.
      - name: Self-test coverage gate
        if: steps.detect.outputs.go == 'true'
        run: |
          chmod +x scripts/test/check-coverage-test.sh
          ./scripts/test/check-coverage-test.sh

      # Build-failing coverage gate (SOW-0010): aggregate + per-package >= 80%
      # statement coverage on the gated internal/* packages (import path contains
      # /internal/ and not /cmd/; non-internal vendored Go is excluded). Runs
      # AFTER the artifact upload so the profile is always retained for diagnosis
      # even when the gate fails.
      - name: Enforce coverage thresholds
        if: steps.detect.outputs.go == 'true'
        run: |
          chmod +x scripts/check-coverage.sh
          ./scripts/check-coverage.sh coverage.out

      - name: Detect benchmarks
        if: steps.detect.outputs.go == 'true'
        id: bench
        shell: bash
        run: |
          if grep -rEq '^func Benchmark[A-Z]' --include='*_test.go' . ; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run benchmarks (smoke)
        if: steps.detect.outputs.go == 'true' && steps.bench.outputs.present == 'true'
        run: |
          go test -run=^$ -bench=. -benchmem -benchtime=1x -count=1 ./... \
            | tee bench-current.txt

      - name: Upload bench artifact
        if: steps.detect.outputs.go == 'true' && steps.bench.outputs.present == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: bench-${{ github.run_id }}
          path: bench-current.txt
          if-no-files-found: error
          retention-days: 14

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect frontend
        id: detect
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          if [[ -f frontend/package.json ]]; then
            echo "fe=true" >> "$GITHUB_OUTPUT"
          else
            echo "fe=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip notice (no frontend yet)
        if: steps.detect.outputs.fe != 'true'
        working-directory: ${{ github.workspace }}
        run: echo "No frontend/package.json present; frontend job is a no-op on this commit."

      - name: Set up Node
        if: steps.detect.outputs.fe == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # Go is needed because the E2E step boots the built ai-viewer-serve binary
      # (scripts/build.sh -> scripts/e2e-serve.sh). go-version-file resolves
      # relative to the repo root, so the frontend job's working-directory
      # default does not affect it; this mirrors the embed-smoke job's setup.
      - name: Set up Go
        if: steps.detect.outputs.fe == 'true'
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Install dependencies
        if: steps.detect.outputs.fe == 'true'
        run: npm ci

      - name: Lint
        if: steps.detect.outputs.fe == 'true'
        run: npm run lint -- --max-warnings=0

      - name: Type check
        if: steps.detect.outputs.fe == 'true'
        run: npm run typecheck

      - name: Unit tests with coverage
        if: steps.detect.outputs.fe == 'true'
        run: npm run test -- --run --coverage

      - name: Upload frontend coverage
        if: steps.detect.outputs.fe == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage-${{ github.run_id }}
          path: frontend/coverage/
          if-no-files-found: error
          retention-days: 14

      - name: Cache Playwright browsers
        if: steps.detect.outputs.fe == 'true'
        id: pw-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Detect Playwright
        if: steps.detect.outputs.fe == 'true'
        id: pw
        shell: bash
        run: |
          if node -e "const p=require('./package.json'); process.exit((p.scripts && p.scripts.e2e) ? 0 : 1)"; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Playwright (browsers + OS deps)
        if: steps.detect.outputs.fe == 'true' && steps.pw.outputs.present == 'true'
        run: npx playwright install --with-deps

      # Build the SPA + embed + both Go binaries BEFORE E2E: the Playwright
      # webServer (scripts/e2e-serve.sh) seeds a temp DB and boots the PRE-BUILT
      # bin/ai-viewer-serve, so bin/ must exist first. build.sh also leaves
      # frontend/dist/ in place for the bundle-size report below, so this is the
      # job's single build (the old trailing `npm run build` is gone).
      - name: Build single binary (frontend + embed + go build)
        if: steps.detect.outputs.fe == 'true'
        working-directory: ${{ github.workspace }}
        run: bash scripts/build.sh

      - name: E2E (Playwright + axe)
        if: steps.detect.outputs.fe == 'true' && steps.pw.outputs.present == 'true'
        run: npm run e2e

      - name: Bundle size report
        if: steps.detect.outputs.fe == 'true'
        shell: bash
        run: |
          mkdir -p ../bundle-report
          if [[ -d dist ]]; then
            du -ab dist | sort -nr > ../bundle-report/sizes.txt
            ( cd dist && find . -type f \( -name '*.js' -o -name '*.css' \) \
              | while read -r f; do
                  gz=$(gzip -c "$f" | wc -c)
                  raw=$(wc -c < "$f")
                  printf '%s\t%s\t%s\n' "$raw" "$gz" "$f"
                done ) | sort -nr > ../bundle-report/gzipped.tsv
          else
            echo "dist/ missing after build" >&2
            exit 1
          fi

      - name: Upload bundle-size report
        if: steps.detect.outputs.fe == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: bundle-size-${{ github.run_id }}
          path: bundle-report/
          if-no-files-found: error
          retention-days: 14

  embed-smoke:
    # Proves the SOW-0001 Chunk 17 milestone: scripts/build.sh produces a
    # single ai-viewer-serve binary that serves the REAL built UI
    # same-origin with /api. Boots the binary against a seeded temp DB and
    # asserts GET / returns the built index.html (hashed asset ref, not the
    # not-built notice), a hashed asset is served with a long cache, and
    # /api/health is up. Also asserts the build leaves a clean git tree
    # (only the .gitkeep sentinel is tracked under frontend_dist/).
    name: embed-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect build prerequisites
        id: detect
        shell: bash
        run: |
          if [[ -f go.mod && -f frontend/package.json && -f scripts/build.sh ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip notice (build pipeline not present yet)
        if: steps.detect.outputs.ready != 'true'
        run: echo "go.mod, frontend/package.json, or scripts/build.sh absent; embed-smoke is a no-op on this commit."

      - name: Set up Go
        if: steps.detect.outputs.ready == 'true'
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Set up Node
        if: steps.detect.outputs.ready == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build single binary (frontend + embed + go build)
        if: steps.detect.outputs.ready == 'true'
        run: bash scripts/build.sh

      - name: Assert clean git tree after build
        if: steps.detect.outputs.ready == 'true'
        shell: bash
        run: |
          # scripts/build.sh writes git-ignored output under frontend_dist/;
          # the build must not modify any tracked file. The only tracked path
          # there is the .gitkeep sentinel.
          dirty="$(git status --porcelain cmd/ai-viewer-serve/frontend_dist/)"
          if [[ -n "$dirty" ]]; then
            echo "build dirtied tracked files under frontend_dist/:" >&2
            echo "$dirty" >&2
            exit 1
          fi
          echo "frontend_dist/ tree clean after build (only .gitkeep tracked)."

      - name: Serve the built UI and assert it is real
        if: steps.detect.outputs.ready == 'true'
        shell: bash
        # Seed a temp DB, boot the freshly built binary, and curl-assert it
        # serves the REAL built UI (hashed asset, long cache) and /api. The
        # logic lives in scripts/embed-smoke.sh so it runs identically on a
        # developer workstation; CI uses the default port (7710).
        run: bash scripts/embed-smoke.sh

  gates:
    name: gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect aggregate scripts
        id: detect
        shell: bash
        run: |
          # scan-secrets is intentionally NOT in this list: it is fail-closed
          # (a dedicated required step below errors if it is absent), so it
          # must never participate in the "all optional scripts absent -> skip"
          # decision. Only the genuinely-optional helpers are detected here.
          for s in gates spec-drift scan-ai-attribution; do
            f="scripts/${s}.sh"
            if [[ -f "$f" ]]; then
              echo "${s//-/_}=true" >> "$GITHUB_OUTPUT"
            else
              echo "${s//-/_}=false" >> "$GITHUB_OUTPUT"
            fi
          done

      - name: Skip notice (no optional aggregate scripts yet)
        if: steps.detect.outputs.gates != 'true' && steps.detect.outputs.spec_drift != 'true' && steps.detect.outputs.scan_ai_attribution != 'true'
        run: echo "No optional scripts/gates.sh, scripts/spec-drift.sh, or scripts/scan-ai-attribution.sh present; only the required secrets scan runs on this commit."

      - name: Set up Go (for gates that shell out to go tools)
        if: hashFiles('go.mod') != ''
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Set up Node (for gates that shell out to node tools)
        if: hashFiles('frontend/package.json') != ''
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # Fail-closed: the secrets + operator-PII scanner is a mandatory gate.
      # A missing scanner is a MISSING GATE, not a pass, so this step errors
      # when either the scanner or its negative self-test is absent. (Contrast
      # with the optional aggregate scripts above, which may be skipped.)
      - name: Require secrets scanner present (fail-closed)
        shell: bash
        run: |
          missing=0
          for f in scripts/scan-secrets.sh scripts/test/scan-secrets-test.sh; do
            if [[ ! -f "$f" ]]; then
              echo "::error::required secrets gate file is absent: $f"
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            echo "The secrets + operator-PII scanner is fail-closed: a missing scanner or self-test fails the gates job." >&2
            exit 1
          fi
          echo "secrets scanner and self-test present."

      # Self-test first: prove the scanner still detects (a gate that cannot
      # detect has silently rotted) before trusting its all-clear on the tree.
      - name: Secrets scanner self-test
        run: |
          chmod +x scripts/test/scan-secrets-test.sh
          ./scripts/test/scan-secrets-test.sh

      - name: Secrets scan
        run: |
          chmod +x scripts/scan-secrets.sh
          ./scripts/scan-secrets.sh

      - name: Spec drift
        if: steps.detect.outputs.spec_drift == 'true'
        run: |
          chmod +x scripts/spec-drift.sh
          ./scripts/spec-drift.sh

      - name: Scan AI attribution
        if: steps.detect.outputs.scan_ai_attribution == 'true'
        run: |
          chmod +x scripts/scan-ai-attribution.sh
          ./scripts/scan-ai-attribution.sh

      - name: Lint systemd units
        if: hashFiles('scripts/test/systemd-units-test.sh') != ''
        run: |
          chmod +x scripts/test/systemd-units-test.sh
          ./scripts/test/systemd-units-test.sh

      - name: Aggregate gates
        if: steps.detect.outputs.gates == 'true'
        run: |
          chmod +x scripts/gates.sh
          ./scripts/gates.sh
