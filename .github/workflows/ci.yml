# ai-viewer CI workflow.
#
# Role
#   This workflow is the substrate for every automated quality gate
#   enumerated in .agents/sow/specs/quality-gates.md. Each gate in that
#   spec maps to a step inside one of the jobs below. The workflow itself
#   does not invent gates; it executes the commands defined by the project
#   skills and local gate scripts.
#
# Conditional-skip pattern
#   The repository was bootstrapped spec-first. Go/frontend jobs still use
#   presence checks while their source trees are absent, then run end to end
#   once the relevant tree lands. SOW-0013 is different: cross-cutting gate
#   files are mandatory once introduced, so the gates job fails when
#   scripts/test/lint-test.sh, scripts/spec-drift.sh,
#   scripts/test/spec-drift-test.sh, scripts/codacy-coverage-upload.sh,
#   scripts/test/codacy-coverage-upload-test.sh,
#   scripts/scan-ai-attribution.sh, or scripts/gates.sh are absent. Only
#   optional helpers such as systemd lint skip by presence.
#
# Job-name contract
#   The job IDs below (lint, test, frontend, embed-smoke, gates) are the
#   contract for branch-protection required status checks. SOW-0013
#   registered these exact names via the GitHub branch-protection API.
#   Renaming a job is a breaking change to that contract and requires a SOW.
#   `codacy-coverage` is deliberately not part of this contract while Codacy is
#   still a reporting/tuning layer.
#
# Extending
#   Future quality SOWs (SOW-0009 onwards) extend this workflow by
#   adding steps to the relevant existing job. A new job is added only when
#   a new top-level concern emerges (e.g. a release job). New job names
#   follow the same contract rule: register them in branch protection in
#   the same SOW that introduces them.
#
# Deferred to subsequent SOWs
#   Gate landing status (.agents/sow/specs/quality-gates.md):
#     - SOW-0009 (LANDED) — strict .golangci.yml + standalone pinned gosec +
#                  pinned tool versions; nightly govulncheck.
#     - SOW-0010 (LANDED) — scripts/{test,check-coverage}.sh: statement
#                  coverage gate (internal/* >= 80%, /cmd/ excluded) enforced
#                  in the test job; nightly race stress (race-stress-nightly.yml).
#                  Branch coverage, new-code-in-PR diff (SOW-0036), and a
#                  per-push -count=3 / coverage PR comment were re-scoped/deferred.
#     - SOW-0011 (LANDED) — adapter fuzz seed corpus per push (deterministic;
#                  the "Fuzz seed corpus" step); -fuzz exploration nightly
#                  (fuzz-nightly.yml); rapid property tests. The benchstat
#                  regression gate is LOCAL (workstation baseline is not
#                  comparable to runner hardware), so the benchtime=1x smoke
#                  below STAYS as the per-push bench signal and the gate's
#                  hardware-independent self-test runs (scripts/test/check-bench-test.sh).
#     - SOW-0012 (LANDED) — frontend quality stack: bundle-size GATE
#                  (frontend/scripts/check-bundle-size.js, manifest-classified,
#                  closure-budgeted, fail-on-violation) in the frontend job
#                  alongside the still-uploaded size report and a gate self-test;
#                  axe a11y on EVERY App.tsx route (zero serious/critical, the
#                  E2E step); and the coverage-config verifier
#                  (frontend/scripts/check-coverage-config.mjs — real-config
#                  non-vacuity + lockstep + disk-completeness + exact canonical
#                  include/threshold shape) plus its hermetic self-test.
#     - SOW-0013 (LANDING) — scripts/{gates,spec-drift}.sh + CodeQL workflow +
#                  Dependabot config
#     - SOW-0044 (LANDING) — codacy-coverage reporting job, fed only from the
#                  existing Go/frontend coverage artifacts; not required in
#                  branch protection until SOW-0046 triages the findings.
#   The secrets + operator-PII scanner (scripts/scan-secrets.sh) and its
#   negative self-test (scripts/test/scan-secrets-test.sh) are already
#   implemented and run as REQUIRED, fail-closed steps in the gates job
#   below; they are not deferred.
#   Each of those SOWs adds steps to existing jobs OR adds new jobs.
#   They do not require renaming the current jobs.
#
# Out of scope here
#   Dependabot config, CodeQL workflow, deployment and release pipelines,
#   and nightly schedules live in their own files. This file covers push
#   and pull-request CI only.

name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# Cancel superseded PR runs to save CI minutes. Master runs are never
# cancelled so the audit trail of every merged commit is preserved.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Require Go lint prerequisites (fail-closed)
        id: detect
        shell: bash
        run: |
          missing=0
          for f in go.mod go.sum .golangci-lint-version; do
            if [[ ! -f "$f" ]]; then
              echo "::error file=$f::required Go lint prerequisite is absent"
              missing=1
            fi
          done
          if [[ ! -f .golangci.yml && ! -f .golangci.yaml ]]; then
            echo "::error::.golangci.yml or .golangci.yaml is required"
            missing=1
          fi
          if [[ "$missing" -ne 0 ]]; then
            echo "Go lint is fail-closed: missing module or lint config files fail this required job." >&2
            exit 1
          fi
          echo "go=true" >> "$GITHUB_OUTPUT"
          echo "golangci=true" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        if: steps.detect.outputs.go == 'true'
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Verify go.mod and go.sum
        if: steps.detect.outputs.go == 'true'
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: gofmt
        if: steps.detect.outputs.go == 'true'
        shell: bash
        run: |
          mapfile -d '' go_files < <(git ls-files -z -- '*.go')
          if [[ "${#go_files[@]}" -eq 0 ]]; then
            echo "::error::no tracked Go files found; gofmt gate is fail-closed"
            exit 1
          fi
          bad=()
          for f in "${go_files[@]}"; do
            out="$(gofmt -l "./$f" 2>&1)" || {
              echo "::error::gofmt failed for a tracked Go file"
              printf 'tracked Go file: %q\n' "$f" >&2
              printf '%s\n' "$out" >&2
              exit 1
            }
            if [[ -n "$out" ]]; then
              bad+=("$f")
            fi
          done
          if [[ "${#bad[@]}" -gt 0 ]]; then
            echo "::error::gofmt reported unformatted tracked Go file(s)"
            printf 'gofmt diff in tracked Go files:\n' >&2
            printf '  %q\n' "${bad[@]}" >&2
            exit 1
          fi

      - name: goimports
        if: steps.detect.outputs.go == 'true'
        shell: bash
        run: |
          go install golang.org/x/tools/cmd/goimports@latest
          mapfile -d '' go_files < <(git ls-files -z -- '*.go')
          if [[ "${#go_files[@]}" -eq 0 ]]; then
            echo "::error::no tracked Go files found; goimports gate is fail-closed"
            exit 1
          fi
          bad=()
          for f in "${go_files[@]}"; do
            out="$(goimports -l "./$f" 2>&1)" || {
              echo "::error::goimports failed for a tracked Go file"
              printf 'tracked Go file: %q\n' "$f" >&2
              printf '%s\n' "$out" >&2
              exit 1
            }
            if [[ -n "$out" ]]; then
              bad+=("$f")
            fi
          done
          if [[ "${#bad[@]}" -gt 0 ]]; then
            echo "::error::goimports reported unformatted tracked Go file(s)"
            printf 'goimports diff in tracked Go files:\n' >&2
            printf '  %q\n' "${bad[@]}" >&2
            exit 1
          fi

      - name: go vet
        if: steps.detect.outputs.go == 'true'
        run: go vet ./...

      - name: Read pinned golangci-lint version
        id: golangci_version
        if: steps.detect.outputs.go == 'true' && steps.detect.outputs.golangci == 'true'
        shell: bash
        run: echo "version=$(tr -d '[:space:]' < .golangci-lint-version)" >> "$GITHUB_OUTPUT"

      - name: golangci-lint
        if: steps.detect.outputs.go == 'true' && steps.detect.outputs.golangci == 'true'
        uses: golangci/golangci-lint-action@v9
        with:
          # Single source of truth: .golangci-lint-version (SOW-0009). A version
          # bump is an intentional, reviewable one-line diff. The action also
          # caches golangci's analysis cache, keeping the warm CI run fast.
          version: ${{ steps.golangci_version.outputs.version }}
          args: --timeout=5m

      - name: govulncheck
        if: steps.detect.outputs.go == 'true'
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: gosec
        if: steps.detect.outputs.go == 'true'
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.26.1
          gosec -severity medium -confidence medium ./...

  test:
    name: test
    runs-on: ubuntu-latest
    # 30m (vs 15m on the other jobs): the per-package `go test -timeout=25m`
    # below must be the binding limit so its timeout fires first with a stack
    # trace; this outer job ceiling sits just above it as a backstop (SOW-0038).
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Require Go test prerequisites (fail-closed)
        id: detect
        shell: bash
        run: |
          missing=0
          for f in go.mod go.sum bench/baseline.txt scripts/check-coverage.sh scripts/test/check-coverage-test.sh scripts/check-bench.sh scripts/test/check-bench-test.sh; do
            if [[ ! -f "$f" ]]; then
              echo "::error file=$f::required Go test prerequisite is absent"
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            echo "Go test is fail-closed: missing module or test gate files fail this required job." >&2
            exit 1
          fi
          echo "go=true" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        if: steps.detect.outputs.go == 'true'
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Build
        if: steps.detect.outputs.go == 'true'
        run: go build ./...

      - name: Test with race detector and coverage
        if: steps.detect.outputs.go == 'true'
        run: |
          # -timeout=25m: the default 10m/package is too tight for the slow
          # internal/ingest rollup test under -race on a loaded CI runner
          # (SOW-0038; the optimization itself is tracked in SOW-0009 Followup).
          go test -race -count=1 -timeout=25m \
            -coverprofile=coverage.out \
            -covermode=atomic \
            ./...

      # Per-push fuzz gate (SOW-0011): run every adapter FuzzXxx target as a
      # seed-corpus test (no -fuzz flag => deterministic; executes the f.Add
      # seeds + any committed testdata/fuzz reproducers). The `./...` run above
      # already exercises these, but this explicit step pins the gate so it
      # survives test-job refactors and is legible. Non-deterministic -fuzz
      # EXPLORATION runs nightly only (fuzz-nightly.yml), never per push (a crash
      # found in unchanged code would block an unrelated PR, non-reproducibly).
      - name: Fuzz seed corpus (deterministic)
        if: steps.detect.outputs.go == 'true'
        run: |
          # Run every adapter FuzzXxx target's seed corpus as a deterministic
          # subtest (no -fuzz flag → f.Add seeds + any committed reproducers).
          go test -run='^Fuzz' ./internal/adapters/...
          # Pin the EXACT (package:target) set — not just bare function names.
          # FuzzParseCursor/FuzzParseLine repeat across packages, so a same-named
          # target MOVED between packages would keep a bare-name multiset unchanged
          # while breaking fuzz-nightly.yml's per-(package,target) matrix. This list
          # MUST match that matrix (changing the set is a deliberate two-file edit).
          got=$(for p in aiagent_v2 aiagent_v3 claude_code codex opencode; do
                  go test -list='^Fuzz' ./internal/adapters/$p/ | grep '^Fuzz' | sed "s|^|$p:|"
                done | sort | tr '\n' ',')
          want='aiagent_v2:FuzzParseCursor,aiagent_v2:FuzzParseSnapshot,aiagent_v3:FuzzParseCursor,aiagent_v3:FuzzParseLine,claude_code:FuzzParseCursor,claude_code:FuzzParseLine,codex:FuzzParseCursor,codex:FuzzParseLine,opencode:FuzzDecodeMessageData,opencode:FuzzDecodePartData,'
          if [ "$got" != "$want" ]; then
            echo "::error::adapter fuzz (package:target) set changed (got [${got}] want [${want}]) — update ci.yml AND fuzz-nightly.yml's matrix together"
            exit 1
          fi

      - name: Coverage summary
        if: steps.detect.outputs.go == 'true'
        run: go tool cover -func=coverage.out | tail -1

      - name: Upload coverage artifact
        if: steps.detect.outputs.go == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: go-coverage-${{ github.run_id }}
          path: coverage.out
          if-no-files-found: error
          retention-days: 14

      # Self-test the coverage gate script itself (synthetic profiles) so a
      # regression in scripts/check-coverage.sh is caught in CI, not just locally.
      - name: Self-test coverage gate
        if: steps.detect.outputs.go == 'true'
        run: |
          chmod +x scripts/test/check-coverage-test.sh
          ./scripts/test/check-coverage-test.sh

      - name: Self-test bench gate
        if: steps.detect.outputs.go == 'true'
        # The bench REGRESSION gate (scripts/check-bench.sh) is a local/workstation
        # tool: its baseline is workstation-measured and is not comparable to
        # GitHub-runner hardware, so it is not run as a CI gate here. Its benchstat
        # parser is hardware-independent, so the synthetic-fixture self-test runs in
        # CI to keep the gate script itself correct (SOW-0011). The self-test drives
        # the real check-bench.sh, which needs benchstat — install it PINNED (the
        # parser depends on benchstat's output format; @latest would risk drift).
        run: |
          go install golang.org/x/perf/cmd/benchstat@v0.0.0-20260512194132-3cf34090a3db
          chmod +x scripts/test/check-bench-test.sh
          ./scripts/test/check-bench-test.sh

      # Build-failing coverage gate (SOW-0010): aggregate + per-package >= 80%
      # statement coverage on the gated internal/* packages (import path contains
      # /internal/ and not /cmd/; non-internal vendored Go is excluded). Runs
      # AFTER the artifact upload so the profile is always retained for diagnosis
      # even when the gate fails.
      - name: Enforce coverage thresholds
        if: steps.detect.outputs.go == 'true'
        run: |
          chmod +x scripts/check-coverage.sh
          ./scripts/check-coverage.sh coverage.out

      - name: Require benchmarks
        if: steps.detect.outputs.go == 'true'
        id: bench
        shell: bash
        run: |
          set +e
          required="$(
            grep -E '^Benchmark[A-Za-z0-9_]+-[0-9]+' bench/baseline.txt \
              | awk '{print $1}' \
              | sed -E 's/-[0-9]+$//' \
              | sort -u
          )"
          required_ec=$?
          set -e
          if [[ "$required_ec" -ne 0 && "$required_ec" -ne 1 ]]; then
            echo "::error file=bench/baseline.txt::failed to extract benchmark names from bench/baseline.txt"
            exit "$required_ec"
          fi
          if [[ -z "$required" ]]; then
            echo "::error file=bench/baseline.txt::no required benchmark names found in bench/baseline.txt"
            exit 1
          fi
          required_count="$(printf '%s\n' "$required" | sed '/^$/d' | wc -l | tr -d '[:space:]')"
          if [[ "$required_count" -ne 5 ]]; then
            echo "::error file=bench/baseline.txt::expected exactly 5 required benchmark names in bench/baseline.txt; got ${required_count}"
            printf 'Required benchmark names found:\n%s\n' "$required" >&2
            exit 1
          fi
          set +e
          actual="$(
            grep -RhoE '^func Benchmark[A-Za-z0-9_]+' \
              --include='*_test.go' \
              --exclude-dir=.git \
              --exclude-dir=frontend/node_modules \
              . \
              | awk '{print $2}' \
              | sort -u
          )"
          actual_ec=$?
          set -e
          if [[ "$actual_ec" -ne 0 && "$actual_ec" -ne 1 ]]; then
            echo "::error::failed to scan Go benchmark functions"
            exit "$actual_ec"
          fi
          missing="$(comm -23 <(printf '%s\n' "$required") <(printf '%s\n' "$actual"))"
          if [[ -n "$missing" ]]; then
            echo "::error::required benchmark function(s) from bench/baseline.txt are missing from the Go test tree"
            printf 'Missing benchmark function(s):\n%s\n' "$missing" >&2
            exit 1
          fi
          echo "present=true" >> "$GITHUB_OUTPUT"

      - name: Run benchmarks (smoke)
        if: steps.detect.outputs.go == 'true' && steps.bench.outputs.present == 'true'
        run: |
          go test -run=^$ -bench=. -benchmem -benchtime=1x -count=1 ./... \
            | tee bench-current.txt

      - name: Upload bench artifact
        if: steps.detect.outputs.go == 'true' && steps.bench.outputs.present == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: bench-${{ github.run_id }}
          path: bench-current.txt
          if-no-files-found: error
          retention-days: 14

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Require frontend prerequisites (fail-closed)
        id: detect
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          missing=0
          for f in go.mod go.sum scripts/build.sh frontend/package.json frontend/package-lock.json; do
            if [[ ! -f "$f" ]]; then
              echo "::error file=$f::required frontend prerequisite is absent"
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            echo "Frontend gates are fail-closed: missing frontend or build prerequisites fail this required job." >&2
            exit 1
          fi
          echo "fe=true" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        if: steps.detect.outputs.fe == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # Go is needed because the E2E step boots the built ai-viewer-serve binary
      # (scripts/build.sh -> scripts/e2e-serve.sh). go-version-file resolves
      # relative to the repo root, so the frontend job's working-directory
      # default does not affect it; this mirrors the embed-smoke job's setup.
      - name: Set up Go
        if: steps.detect.outputs.fe == 'true'
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Install dependencies
        if: steps.detect.outputs.fe == 'true'
        run: npm ci

      # The `lint` npm script already bakes in `--max-warnings=0` (single source of
      # truth, matching scripts/lint.sh); do not re-pass the flag here.
      - name: Lint
        if: steps.detect.outputs.fe == 'true'
        run: npm run lint

      - name: Type check
        if: steps.detect.outputs.fe == 'true'
        run: npm run typecheck

      # Runs the unit/component suite AND enforces coverage thresholds: the global
      # aggregate floor plus a per-directory >= 80% lines floor for every measured
      # dir under src/components/ and src/pages/ (vitest.config.ts glob-keyed
      # `coverage.thresholds`, Vitest's native mechanism — a single under-covered
      # dir fails this step even when the aggregate stays green). Also writes the
      # HTML + json coverage reports uploaded below.
      - name: Unit tests with coverage (+ per-directory thresholds)
        if: steps.detect.outputs.fe == 'true'
        run: npm run test -- --run --coverage

      - name: Upload frontend coverage
        if: steps.detect.outputs.fe == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage-${{ github.run_id }}
          path: frontend/coverage/
          if-no-files-found: error
          retention-days: 14

      # Self-test the per-directory coverage gate's WIRING (hermetic: a throwaway
      # fixture project with a known 50%-lines dir). Proves the native glob-keyed
      # thresholds still FAIL closed (exit 1, naming the dir) on an under-covered
      # dir and PASS on a covered one — catching a future config edit that drops
      # the glob keys or a Vitest bump that changes the threshold schema, which
      # would otherwise silently disable per-dir enforcement. Mirrors the
      # bundle-size gate self-test; independent of the build above.
      - name: Self-test per-directory coverage gate
        if: steps.detect.outputs.fe == 'true'
        run: npm run check:coverage-thresholds:selftest

      # Verify the REAL Vitest coverage config (not the fixture the self-test
      # above uses): every per-dir glob matches >= 1 real source file (an empty
      # glob group vacuously passes Vitest's threshold), every measured
      # component/page dir has a per-dir floor (lockstep), every source dir/flat-file
      # under the two roots is measured or explicitly excluded (disk-completeness),
      # and every per-dir include is the whole-dir shape so no sibling source escapes.
      # Reads the same shared lists vitest.config.ts imports, so it checks the gate
      # Vitest enforces. Build-free (node:fs only), so it does not depend on the build below.
      - name: Verify coverage config (non-vacuity + bidirectional lockstep + disk-completeness + exact shape)
        if: steps.detect.outputs.fe == 'true'
        run: npm run check:coverage-config

      # Self-test the coverage-config VERIFIER's own decision logic (hermetic:
      # a throwaway fixture source tree) so a regression in the verifier (a check
      # that stops firing) is caught even though the real config above is sound.
      # Mirrors the bundle-size / coverage-thresholds gate self-tests.
      - name: Self-test coverage-config verifier
        if: steps.detect.outputs.fe == 'true'
        run: npm run check:coverage-config:selftest

      - name: Cache Playwright browsers
        if: steps.detect.outputs.fe == 'true'
        id: pw-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Require Playwright E2E script
        if: steps.detect.outputs.fe == 'true'
        id: pw
        shell: bash
        run: |
          if node -e "const p=require('./package.json'); process.exit((p.scripts && p.scripts.e2e) ? 0 : 1)"; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error file=frontend/package.json::required npm script is absent: e2e"
            exit 1
          fi

      - name: Install Playwright (browsers + OS deps)
        if: steps.detect.outputs.fe == 'true' && steps.pw.outputs.present == 'true'
        run: npx playwright install --with-deps

      # Build the SPA + embed + both Go binaries BEFORE E2E: the Playwright
      # webServer (scripts/e2e-serve.sh) seeds a temp DB and boots the PRE-BUILT
      # bin/ai-viewer-serve, so bin/ must exist first. build.sh also leaves
      # frontend/dist/ in place for the bundle-size report below, so this is the
      # job's single build (the old trailing `npm run build` is gone).
      - name: Build single binary (frontend + embed + go build)
        if: steps.detect.outputs.fe == 'true'
        working-directory: ${{ github.workspace }}
        run: bash scripts/build.sh

      - name: E2E (Playwright + axe)
        if: steps.detect.outputs.fe == 'true' && steps.pw.outputs.present == 'true'
        run: npm run e2e

      # Self-test the bundle-size gate script itself (synthetic high-entropy
      # fixtures) so a regression in scripts/check-bundle-size.js is caught in
      # CI, not just locally — mirrors the test job's coverage/bench self-tests.
      # Hermetic (builds its own temp dist), so it does not depend on the build
      # above.
      - name: Self-test bundle-size gate
        if: steps.detect.outputs.fe == 'true'
        run: npm run check:bundle-size:selftest

      - name: Bundle size report
        if: steps.detect.outputs.fe == 'true'
        shell: bash
        run: |
          mkdir -p ../bundle-report
          if [[ -d dist ]]; then
            du -ab dist | sort -nr > ../bundle-report/sizes.txt
            ( cd dist && find . -type f \( -name '*.js' -o -name '*.css' \) \
              | while read -r f; do
                  gz=$(gzip -c "$f" | wc -c)
                  raw=$(wc -c < "$f")
                  printf '%s\t%s\t%s\n' "$raw" "$gz" "$f"
                done ) | sort -nr > ../bundle-report/gzipped.tsv
          else
            echo "dist/ missing after build" >&2
            exit 1
          fi

      # Upload the report BEFORE the enforcing gate below, so the size artifact
      # is always retained for diagnosis even when the gate fails the job
      # (mirrors the test job uploading coverage.out before the coverage gate).
      - name: Upload bundle-size report
        if: steps.detect.outputs.fe == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: bundle-size-${{ github.run_id }}
          path: bundle-report/
          if-no-files-found: error
          retention-days: 14

      # Enforced bundle-size GATE (SOW-0012): classify chunks from
      # dist/.vite/manifest.json and FAIL the job if an isEntry chunk exceeds
      # 500 KB gz or an isDynamicEntry chunk exceeds 200 KB gz. Runs against the
      # dist/ produced by the build step above (scripts/build.sh leaves it in
      # place). Replaces the old report-only behavior.
      - name: Bundle size gate (enforce)
        if: steps.detect.outputs.fe == 'true'
        run: npm run check:bundle-size

  codacy-coverage:
    # Reporting-only while Codacy findings are being tuned. Required jobs above
    # remain the authoritative merge gates; this job consumes their artifacts
    # and uploads coverage only when a Codacy token exists.
    name: codacy-coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [test, frontend]
    # `always()` keeps needs.*.result readable after upstream jobs fail/skip; the
    # explicit success checks below still prevent checkout/secrets/script work.
    if: ${{ always() && github.event_name != 'pull_request' && needs.test.result == 'success' && needs.frontend.result == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Download Go coverage
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: go-coverage-${{ github.run_id }}
          path: .codacy-coverage/go

      - name: Download frontend coverage
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: frontend-coverage-${{ github.run_id }}
          path: .codacy-coverage/frontend

      - name: Upload coverage to Codacy
        # Codacy is reporting-only during SOW-0044. Expected upload problems
        # emit annotations and exit zero; unexpected script failures should stay
        # visible because this implementation is still maintained code.
        shell: bash
        env:
          CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
          CODACY_API_TOKEN: ${{ secrets.CODACY_API_TOKEN }}
          CODACY_ORGANIZATION_PROVIDER: gh
          CODACY_USERNAME: netdata
          CODACY_PROJECT_NAME: ai-viewer
        run: bash scripts/codacy-coverage-upload.sh

  embed-smoke:
    # Proves the SOW-0001 Chunk 17 milestone: scripts/build.sh produces a
    # single ai-viewer-serve binary that serves the REAL built UI
    # same-origin with /api. Boots the binary against a seeded temp DB and
    # asserts GET / returns the built index.html (hashed asset ref, not the
    # not-built notice), a hashed asset is served with a long cache, and
    # /api/health is up. Also asserts the build leaves a clean git tree
    # (only the .gitkeep sentinel is tracked under frontend_dist/).
    name: embed-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Require embed-smoke prerequisites (fail-closed)
        id: detect
        shell: bash
        run: |
          missing=0
          for f in go.mod go.sum scripts/build.sh scripts/embed-smoke.sh scripts/test/embed-smoke-seed-marker-test.sh frontend/package.json frontend/package-lock.json; do
            if [[ ! -f "$f" ]]; then
              echo "::error file=$f::required embed-smoke prerequisite is absent"
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            echo "Embed-smoke is fail-closed: missing build, smoke, or frontend prerequisites fail this required job." >&2
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        if: steps.detect.outputs.ready == 'true'
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Set up Node
        if: steps.detect.outputs.ready == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build single binary (frontend + embed + go build)
        if: steps.detect.outputs.ready == 'true'
        run: bash scripts/build.sh

      - name: Assert clean git tree after build
        if: steps.detect.outputs.ready == 'true'
        shell: bash
        run: |
          # scripts/build.sh writes git-ignored output under frontend_dist/;
          # the build must not modify any tracked file. The only tracked path
          # there is the .gitkeep sentinel.
          dirty="$(git status --porcelain cmd/ai-viewer-serve/frontend_dist/)"
          if [[ -n "$dirty" ]]; then
            echo "build dirtied tracked files under frontend_dist/:" >&2
            echo "$dirty" >&2
            exit 1
          fi
          echo "frontend_dist/ tree clean after build (only .gitkeep tracked)."

      - name: Guard embed-smoke seed marker (regression SOW-0007)
        if: steps.detect.outputs.ready == 'true'
        shell: bash
        # The seed must wait for the dynamically-derived LAST migration, not a
        # hardcoded one — a stale 0005 marker once seeded an un-finished v5 DB
        # serve rejected (flaky). Fast content guard; the smoke run below is the
        # behavioral test.
        run: bash scripts/test/embed-smoke-seed-marker-test.sh

      - name: Serve the built UI and assert it is real
        if: steps.detect.outputs.ready == 'true'
        shell: bash
        # Seed a temp DB, boot the freshly built binary, and curl-assert it
        # serves the REAL built UI (hashed asset, long cache) and /api. The
        # logic lives in scripts/embed-smoke.sh so it runs identically on a
        # developer workstation; CI uses the default port (7710).
        run: bash scripts/embed-smoke.sh

  gates:
    name: gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Fail-closed: the secrets + operator-PII scanner is a mandatory gate.
      # A missing scanner is a MISSING GATE, not a pass, so this step errors
      # when either the scanner or its negative self-test is absent. (Contrast
      # with optional helper scripts such as systemd lint, which may be skipped.)
      - name: Require secrets scanner present (fail-closed)
        shell: bash
        run: |
          missing=0
          for f in scripts/scan-secrets.sh scripts/test/scan-secrets-test.sh; do
            if [[ ! -f "$f" ]]; then
              echo "::error::required secrets gate file is absent: $f"
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            echo "The secrets + operator-PII scanner is fail-closed: a missing scanner or self-test fails the gates job." >&2
            exit 1
          fi
          echo "secrets scanner and self-test present."

      # Fail-closed: lint-test, spec-drift, Codacy coverage upload self-test,
      # AI-attribution, and gates.sh are mandatory gate infrastructure. Missing
      # files are missing gates, not passes.
      - name: Require cross-cutting gates present (fail-closed)
        shell: bash
        run: |
          missing=0
          for f in scripts/test/lint-test.sh scripts/spec-drift.sh scripts/test/spec-drift-test.sh scripts/codacy-coverage-upload.sh scripts/test/codacy-coverage-upload-test.sh scripts/scan-ai-attribution.sh scripts/gates.sh; do
            if [[ ! -f "$f" ]]; then
              echo "::error::required gate file is absent: $f"
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            echo "The lint self-test, spec-drift detector, Codacy coverage upload self-test, AI-attribution scanner, and local aggregate are fail-closed: missing required gate files fail the gates job." >&2
            exit 1
          fi
          echo "lint self-test, spec-drift detector, Codacy coverage upload self-test, AI-attribution scanner, and local aggregate present."

      - name: Local aggregate syntax check
        run: bash -n scripts/gates.sh

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Lint formatter-scope self-test
        run: |
          chmod +x scripts/test/lint-test.sh
          ./scripts/test/lint-test.sh

      # Self-test first: prove the scanner still detects (a gate that cannot
      # detect has silently rotted) before trusting its all-clear on the tree.
      - name: Secrets scanner self-test
        run: |
          chmod +x scripts/test/scan-secrets-test.sh
          ./scripts/test/scan-secrets-test.sh

      - name: Secrets scan
        run: |
          chmod +x scripts/scan-secrets.sh
          ./scripts/scan-secrets.sh

      # Same fail-closed ordering as the secrets scanner: prove the detector
      # still catches planted drift before trusting its all-clear on the tree.
      - name: Spec drift self-test
        run: |
          chmod +x scripts/test/spec-drift-test.sh
          ./scripts/test/spec-drift-test.sh

      - name: Spec drift
        run: |
          chmod +x scripts/spec-drift.sh
          ./scripts/spec-drift.sh

      - name: Codacy coverage upload self-test
        run: |
          chmod +x scripts/test/codacy-coverage-upload-test.sh
          ./scripts/test/codacy-coverage-upload-test.sh

      - name: Scan AI attribution
        run: |
          chmod +x scripts/scan-ai-attribution.sh
          ./scripts/scan-ai-attribution.sh

      - name: Lint systemd units
        if: hashFiles('scripts/test/systemd-units-test.sh') != ''
        run: |
          chmod +x scripts/test/systemd-units-test.sh
          ./scripts/test/systemd-units-test.sh
