# Nightly govulncheck (SOW-0009).
#
# Rationale: a CVE disclosed against a transitive dependency mid-day must not
# block an unrelated PR within the same hour. The per-push govulncheck in
# ci.yml is advisory for such drive-by CVEs; THIS scheduled job is the standing
# gate that surfaces newly-disclosed vulnerabilities against master daily.
#
# Authoritative gate: .agents/sow/specs/quality-gates.md "Go — Security".
name: govulncheck-nightly

on:
  schedule:
    # 07:00 UTC daily — a low-traffic hour; far from typical PR bursts.
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck (nightly)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
