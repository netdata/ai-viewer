---
# Codacy configuration file (docs: https://docs.codacy.com/repositories-configure/codacy-configuration-file).
#
# Controls exclude paths, language enablement, and engine configs. Per Codacy
# docs, tool enable/disable is dashboard-only (Code Patterns page).
# TSQLLint/Stylelint/Lizard/ESLint8/Agentlinter are disabled there.
exclude_paths:
  - ".agents/sow/current/**"
  - ".agents/sow/done/**"
  - ".agents/sow/pending/**"
  - ".codacy/generated/**"
  - "CLAUDE.md"
  - "GEMINI.md"
  - "cmd/ai-viewer-serve/frontend_dist/**"
  - "frontend/node_modules/**"
  - "frontend/package-lock.json"
  - "frontend/coverage/**"
  - "frontend/dist/**"
  - "frontend/playwright-report/**"
  - "frontend/test-results/**"
  - "testdata/**"
  - "bin/**"
  - "go.sum"
languages:
  sql:
    enabled: false
engines:
  duplication:
    exclude_paths:
      - "testdata/**"
      - "frontend/package-lock.json"
      - "go.sum"
      - "**/*_test.go"
      - "frontend/src/**/*.test.ts"
      - "frontend/src/**/*.test.tsx"
      - "frontend/src/test/**"
      - "frontend/tests/**"
