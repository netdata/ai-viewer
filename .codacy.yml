---
# SOW-0046: repository-wide exclusions are intentionally limited to non-runtime
# SOW work-ledger files, duplicate instruction symlinks, generated analyzer
# material, embedded/build output, dependencies, coverage reports, local test
# output, and local binary output. They also carry the ignored-file policy
# explicitly because Codacy ignores UI ignored-file settings when this file exists.
# testdata/** added (SOW-0072): test fixtures are not production code.
exclude_paths:
  - ".agents/sow/current/**"
  - ".agents/sow/done/**"
  - ".agents/sow/pending/**"
  - ".codacy/generated/**"
  - "CLAUDE.md"
  - "GEMINI.md"
  - "cmd/ai-viewer-serve/frontend_dist/**"
  - "frontend/node_modules/**"
  - "frontend/coverage/**"
  - "frontend/dist/**"
  - "frontend/playwright-report/**"
  - "frontend/test-results/**"
  - "testdata/**"
  - "bin/**"

# SOW-0046: eslint-8 exclusions are tool-scoped to non-runtime frontend tests,
# test support, and standalone frontend scripts only. These paths are not
# repository-wide Codacy exclusions.
# Tests and test support stay covered by native ESLint/TypeScript/Vitest/Playwright
# as applicable. Standalone frontend scripts stay covered by dedicated script
# self-tests/build integration plus repository-wide secrets/spec-drift gates.
# Runtime frontend and Go source remain analyzable.
engines:
  eslint-8:
    exclude_paths:
      - "frontend/tests/**"
      - "frontend/src/**/*.test.ts"
      - "frontend/src/**/*.test.tsx"
      - "frontend/src/test/**"
      - "frontend/scripts/**"
  # Disabled: Lizard cyclomatic complexity + NLOC. CCN-8 and NLOC-50 thresholds
  # produce false positives for React components (JSX conditionals inflate CCN
  # without indicating real complexity) and Go format parsers (switch-heavy by
  # construction). Complexity is tracked via the project's 400-line file-size
  # convention (AGENTS.md) + the function-size guidelines in the project-coding
  # skill + code review. Lizard test-file exclusions remain as documentation.
  lizard:
    enabled: false
    exclude_paths:
      - "**/*_test.go"
      - "frontend/src/**/*.test.ts"
      - "frontend/src/**/*.test.tsx"
      - "frontend/src/test/**"
      - "frontend/tests/**"
  # Disabled: TSQLLint is a Microsoft SQL Server linter — its rules (SET ANSI,
  # data compression, schema-qualify, keyword capitalization) are T-SQL concepts
  # that do not exist in SQLite. Every TSQLLint finding on the migration files
  # is a false positive. SQLite schema/migration correctness is validated by the
  # Go test suite (schema_contract_test.go + migration tests), not by TSQLLint.
  tsqllint:
    enabled: false
  # Disabled: Stylelint expects kebab-case class names, but the project uses
  # camelCase CSS Modules consistently (e.g. .summaryBar, .filterGroup — React's
  # CSS Modules convention). The scss rule is a broken Codacy config ("Unknown
  # rule scss_function-disallowed-list"). CSS is validated via the Vite/PostCSS
  # build pipeline + the bundle-size gate; no local stylelint exists.
  stylelint:
    enabled: false
