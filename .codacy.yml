---
# SOW-0046: repository-wide exclusions are intentionally limited to non-runtime
# SOW work-ledger files, duplicate instruction symlinks, generated analyzer
# material, embedded/build output, dependencies, coverage reports, local test
# output, and local binary output. They also carry the ignored-file policy
# explicitly because Codacy ignores UI ignored-file settings when this file exists.
exclude_paths:
  - ".agents/sow/current/**"
  - ".agents/sow/done/**"
  - ".agents/sow/pending/**"
  - ".codacy/generated/**"
  - "CLAUDE.md"
  - "GEMINI.md"
  - "cmd/ai-viewer-serve/frontend_dist/**"
  - "frontend/node_modules/**"
  - "frontend/coverage/**"
  - "frontend/dist/**"
  - "frontend/playwright-report/**"
  - "frontend/test-results/**"
  - "bin/**"

# SOW-0046: eslint-8 exclusions are tool-scoped to non-runtime frontend tests,
# test support, and standalone frontend scripts only. These paths are not
# repository-wide Codacy exclusions.
# Tests and test support stay covered by native ESLint/TypeScript/Vitest/Playwright
# as applicable. Standalone frontend scripts stay covered by dedicated script
# self-tests/build integration plus repository-wide secrets/spec-drift gates.
# Runtime frontend and Go source remain analyzable.
engines:
  eslint-8:
    exclude_paths:
      - "frontend/tests/**"
      - "frontend/src/**/*.test.ts"
      - "frontend/src/**/*.test.tsx"
      - "frontend/src/test/**"
      - "frontend/scripts/**"
